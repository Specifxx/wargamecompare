name: Probe stores

# Research only: reads probe/candidates.txt the way the import would and commits probe/results.json to the
# claude/* branch it ran on. Never touches data/ or main.
on:
  push:
    branches: ["claude/**"]
    paths: ["probe/candidates.txt", "scripts/probe-stores.ts", "src/data/stores.json", "src/lib/import/**"]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3, 4, 5, 6, 7]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/probe-stores.ts
        env:
          SHARD: ${{ matrix.shard }}
          SHARDS: 8
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe-${{ matrix.shard }}
          path: probe/out-${{ matrix.shard }}.json
          if-no-files-found: ignore
  collect:
    needs: probe
    if: always()
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/download-artifact@v4
        with:
          path: shards
      - run: |
          set -euo pipefail
          node -e '
            const fs=require("fs"),p=require("path");let rows=[];
            for (const d of fs.readdirSync("shards")) for (const f of fs.readdirSync(p.join("shards",d))) rows.push(...JSON.parse(fs.readFileSync(p.join("shards",d,f),"utf8")));
            rows.sort((a,b)=>a.region.localeCompare(b.region)||a.host.localeCompare(b.host));
            fs.writeFileSync("probe/results.json", JSON.stringify(rows,null,1));'
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add probe/results.json
          git commit -m "probe: store results" || exit 0
          for i in 1 2 3 4; do git push origin HEAD:${GITHUB_REF_NAME} && exit 0; sleep $((2 ** i)); git pull --rebase origin ${GITHUB_REF_NAME}; done
          exit 1
  trial:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/import.ts --only mindgames,hobbytechtoys,warandpeacegames,wargamershub,westcoastgames,battlereadygames,doublestarhobby,imperialhobbies,jrtoycanada,kingdomtitans,mapleairbrush,fenrisworkshop,tabletoprenaissance,gamecorner,hobbycity,kapitihobbies,afistfulofdice,castlecomics,wargamesemporium --concurrency 3
      - run: node -e 'const m=require("./data/meta.json");for (const [k,v] of Object.entries(m.stores)) if (["mindgames","hobbytechtoys","warandpeacegames","wargamershub","westcoastgames","battlereadygames","doublestarhobby","imperialhobbies","jrtoycanada","kingdomtitans","mapleairbrush","fenrisworkshop","tabletoprenaissance","gamecorner","hobbycity","kapitihobbies","afistfulofdice","castlecomics","wargamesemporium"].includes(k)) console.log(k, JSON.stringify(v));'
