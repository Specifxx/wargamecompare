name: Release now

# A production build out of turn: lands an EMPTY commit whose subject carries [deploy] on main. Only when the owner
# says a release is urgent; everything else rides the daily data commit.
on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit --allow-empty -m "WargameCompare release [deploy]" -m "Dispatched by release.yml."
          git push origin HEAD:main
