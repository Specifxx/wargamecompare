name: Trial import (temporary)
on:
  push:
    branches: [claude/project-thread-7av3np]
permissions:
  contents: write
jobs:
  import:
    if: contains(github.event.head_commit.message, 'trial import')
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - run: npx tsx scripts/import.ts --concurrency 2 2>&1 | tee import.log
      - run: |
          mkdir -p trial && cp import.log trial/ && cp data/*.json trial/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f trial && git commit -q -m "Trial import output" && git push origin HEAD:claude/project-thread-7av3np
