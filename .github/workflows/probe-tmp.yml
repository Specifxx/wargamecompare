name: Probe stores (temporary)
on:
  push:
    branches: ["claude/**"]
    paths: ["probe/**", ".github/workflows/probe-tmp.yml"]
  workflow_dispatch:
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 300
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with: { node-version: 20 }
      - run: node probe/probe2.mjs
