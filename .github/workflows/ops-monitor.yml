name: Ops monitor

# Every six hours: is the import fresh, are the stores being read, is eBay within its budget, is the live site up?
# A failing check fails this run and GitHub emails the owner (src/lib/ops.ts, docs in DEPLOY.md "Monitoring").
on:
  schedule:
    - cron: "40 */6 * * *"
  workflow_dispatch:

permissions:
  contents: write # the ops-status branch only

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          ref: main
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - run: npm ci --no-audit --no-fund
      - env:
          SITE_URL: ${{ vars.SITE_URL }}
          EBAY_ENABLED: ${{ secrets.EBAY_CLIENT_ID != '' && 'true' || 'false' }}
          EBAY_DAILY_CAP: ${{ vars.EBAY_DAILY_CAP }}
        run: npx tsx scripts/ops-monitor.ts
      # Empire HQ (riftcompare.com/admin/hq) and the Monday report read this file
      # from the public `ops-status` branch: one orphan commit, force-pushed, so the
      # branch stays one small file. Status and our own sentences only.
      - name: Publish status for Empire HQ
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          [ -f ops-status.json ] || { echo "No status file written."; exit 0; }
          d=$(mktemp -d) && cp ops-status.json "$d/status.json" && cd "$d"
          git init -q -b ops-status && git add status.json
          git -c user.name="github-actions[bot]" -c user.email="41898283+github-actions[bot]@users.noreply.github.com" commit -qm "ops status"
          git push -qf "https://x-access-token:${GH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" ops-status
